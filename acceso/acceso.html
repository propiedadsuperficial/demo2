<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso | demo2</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: #0b0c10;
      color: #e6edf3;
    }
    .card {
      width: min(500px, 92vw);
      background: #151a24;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin-top: 0; }
    label { font-size: .9rem; color: #9fb0c3; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #2b3445;
      background: #0f1420;
      color: #e6edf3;
    }
    button {
      margin-top: 12px;
      padding: 12px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #00b3ff;
      color: #001019;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: .9rem;
    }
    .ok   { color: #35c759; }
    .warn { color: #ffb020; }
    .err  { color: #ff4d4f; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Acceso al GIS</h1>
    <p>Recibirás un enlace de acceso por correo (sin contraseña).</p>

    <form id="form-acceso">
      <label for="email">Correo corporativo</label>
      <input
        id="email"
        type="email"
        placeholder="usuario@pucobre.cl"
        required
        autocomplete="email"
      />

      <button id="btn-enviar" type="submit">Enviar enlace</button>
      <div id="status" class="status"></div>
    </form>
  </main>

  <!-- JS del flujo passwordless -->
  <script type="module" src="../js/acceso.js"></script>
</body>
</html>
