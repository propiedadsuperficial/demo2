<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIS Pucobre v2.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div id="toolbar">
        <strong>PUCOBRE GIS</strong>
        <button id="saveBtn" class="btn btn-save" disabled>💾 Guardar Cambios</button>
        <label class="btn btn-kml" for="kmlInput">📁 Cargar KML</label>
        <input id="kmlInput" type="file" style="display:none" accept=".kml,.kmz" />
        <div id="userInfo"></div>
        <span id="status" class="status">🔌 Iniciando...</span>
    </div>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
