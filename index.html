<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre (Versión Estable)</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #map { height: calc(100vh - 84px); }
    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px; border-bottom: 1px solid #e0e0e0; font-family: system-ui, Arial;
      background: #fafafa;
    }
    .toolbar button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-save { background: #28a745; color: white; border-color: #218838; }
    .btn-save:disabled { background: #6c757d; cursor: not-allowed; }
    .btn-secondary { background: #f8f9fa; color: #333; }
    .coords { margin-left: auto; font-family: monospace; }
  </style>
</head>
<body>

  <div class="toolbar">
    <strong>Pucobre GIS:</strong>
    <button id="btnGuardar" class="btn-save" disabled>💾 Guardar Cambios</button>
    <button id="btnSubirKml" class="btn-secondary">📁 Cargar KML</button>
    <button id="btnDescargar" class="btn-secondary">⬇️ Exportar</button>
    
    <input type="file" id="fileInput" accept=".kml,application/vnd.google-earth.kml+xml" style="display:none" />
    <span class="coords" id="coords">Lat/Lon: —</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const dibujosRef = collection(db, "geometrias");
    const miNombre = prompt("Nombre del Operador:") || "Operador";

    const map = L.map('map').setView([-27.366, -70.332], 15);
    const cloudItems = L.featureGroup().addTo(map); // Elementos de la nube
    const localItems = L.featureGroup().addTo(map); // Borradores locales

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

    const drawControl = new L.Control.Draw({
      edit: { featureGroup: localItems, remove: true },
      draw: { circlemarker: false, circle: false }
    }).addTo(map);

    // --- LOGICA DE DIBUJO LOCAL ---
    map.on(L.Draw.Event.CREATED, (e) => {
      const layer = e.layer;
      localItems.addLayer(layer);
      document.getElementById('btnGuardar').disabled = false; // Habilitar disquete
      document.getElementById('btnGuardar').style.backgroundColor = "#dc3545"; // Color de alerta
    });

    // --- BOTÓN DISQUETE: GUARDAR EN FIREBASE ---
    document.getElementById('btnGuardar').onclick = async () => {
      const btn = document.getElementById('btnGuardar');
      btn.textContent = "⌛ Guardando...";
      btn.disabled = true;

      const promises = [];
      localItems.eachLayer((layer) => {
        promises.push(addDoc(dibujosRef, {
          feature: layer.toGeoJSON(),
          autor: miNombre,
          fecha: new Date().toLocaleString('es-CL')
        }));
      });

      try {
        await Promise.all(promises);
        localItems.clearLayers(); // Limpiar borradores
        btn.textContent = "💾 Guardar Cambios";
        btn.style.backgroundColor = "#28a745";
        alert("Sincronización exitosa con la nube.");
      } catch (err) {
        alert("Error al guardar. Reintente.");
        btn.disabled = false;
      }
    };

    // --- SINCRONIZACIÓN (SOLO LECTURA DE LA NUBE) ---
    onSnapshot(dibujosRef, (snapshot) => {
      cloudItems.clearLayers();
      snapshot.forEach((documento) => {
        const data = documento.data();
        L.geoJSON(data.feature, {
          onEachFeature: (f, l) => {
            l.options.firebaseId = documento.id;
            l.bindPopup(`<b>Autor:</b> ${data.autor}<br><b>Fecha:</b> ${data.fecha}`);
            cloudItems.addLayer(l);
          }
        });
      });
    });

    // --- KML: IMPORTAR COMO BORRADOR ---
    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnSubirKml').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => {
        const kmlLayer = omnivore.kml.parse(ev.target.result);
        kmlLayer.on('ready', () => {
          map.fitBounds(kmlLayer.getBounds());
          kmlLayer.eachLayer(l => localItems.addLayer(l)); // Se añaden como borradores
          document.getElementById('btnGuardar').disabled = false;
        });
      };
      reader.readAsText(file);
    };

    map.on('mousemove', e => {
      document.getElementById('coords').textContent = `Lat/Lon: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
    });
  </script>
</body>
</html>
