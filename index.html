<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIS Pucobre - Proyectos Colaborativos</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="css/index.css" />
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Barra de herramientas superior */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            background: #2c3e50;
            color: white;
            height: 60px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1100;
            position: relative;
        }

        /* Contenedor Principal (Flexbox para TOC a la izquierda) */
        #main-wrapper {
            display: flex;
            height: calc(100vh - 60px);
            width: 100%;
        }

        /* Panel Lateral (TOC) */
        #sidebar-gis {
            width: 320px;
            background: #fdfdfd;
            border-right: 1px solid #ced4da;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .toc-title {
            background: #34495e;
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #toc-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Contenedor del Mapa */
        #map-view {
            flex-grow: 1;
            height: 100%;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Personalización del Control de Capas de Leaflet en el Sidebar */
        .leaflet-control-layers {
            box-shadow: none !important;
            border: none !important;
            background: transparent !important;
            width: 100%;
        }
        .leaflet-control-layers-list {
            font-size: 13px;
        }
        .leaflet-control-layers-group-name {
            font-weight: bold;
            color: #27ae60;
            display: block;
            margin-top: 10px;
            border-bottom: 1px solid #eee;
        }

        /* Estilos de Botones y Status */
        .btn-kml { 
            background-color: #27ae60 !important; 
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
        }
        .btn-save {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .status-container { 
            flex-grow: 1; 
            text-align: right; 
            font-size: 0.85em; 
            color: #bdc3c7;
        }
        #userInfo { 
            border-left: 1px solid #7f8c8d; 
            padding-left: 15px; 
            font-weight: bold; 
            color: #ecf0f1;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="https://www.pucobre.cl/wp-content/uploads/2021/10/logo-pucobre.png" alt="Logo Pucobre" style="height: 25px; filter: brightness(0) invert(1);">
            <strong style="font-size: 1.1em;">GIS</strong>
        </div>

        <button id="saveBtn" class="btn btn-save" disabled>💾 Guardar Cambios</button>
        
        <label class="btn btn-kml" for="kmlInput">📁 Cargar KML / GeoJSON</label>
        <input id="kmlInput" type="file" style="display:none" accept=".kml,.kmz,.geojson,.json" />

        <div class="status-container">
            <span id="status" class="status">🔌 Iniciando conexión...</span>
        </div>
        <div id="userInfo">👤 Identificando...</div>
    </div>

    <div id="main-wrapper">
        
        <aside id="sidebar-gis">
            <div class="toc-title">Tabla de Contenidos</div>
            <div id="toc-container">
                </div>
        </aside>

        <main id="map-view">
            <div id="map"></div>
        </main>

    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script type="module" src="js/index.js"></script>

</body>
</html>
