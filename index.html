<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
    #toolbar { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #map { width: 100%; height: calc(100% - 60px); background: #eee; }
    .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-save { background: #27ae60; color: white; }
    .btn-save:disabled { background: #7f8c8d; cursor: not-allowed; }
    .btn-save.pending { background: #e74c3c; }
    .status { font-size: 12px; color: #bdc3c7; margin-left: auto; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>PUCOBRE GIS</strong>
    <button id="saveBtn" class="btn btn-save" disabled>💾 Guardar Cambios</button>
    <label class="btn" style="background:#3498db; color:white" for="kmlInput">📁 Cargar KML</label>
    <input id="kmlInput" type="file" style="display:none" accept=".kml" />
    <span id="status" class="status">Conectando...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js';
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js';

    // Credenciales Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const miNombre = prompt("Operador:") || "Operador";

    // Mapa con Esri Satélite
    const map = L.map('map').setView([-27.366, -70.332], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery'
    }).addTo(map);

    const cloudLayers = L.featureGroup().addTo(map);
    const localDrafts = L.featureGroup().addTo(map);

    new L.Control.Draw({
      edit: { featureGroup: localDrafts },
      draw: { 
        circle: false, 
        circlemarker: false,
        polyline: { shapeOptions: { color: '#f39c12', weight: 4 } },
        polygon: { shapeOptions: { color: '#f39c12', weight: 4, fillOpacity: 0.3 } },
        rectangle: { shapeOptions: { color: '#f39c12', weight: 4, fillOpacity: 0.3 } },
        marker: true
      }
    }).addTo(map);

    // Contador de capas pendientes
    let pendingChanges = 0;

    function updateSaveButton() {
      const btn = document.getElementById('saveBtn');
      if (pendingChanges > 0) {
        btn.disabled = false;
        btn.classList.add('pending');
        btn.textContent = `💾 Guardar Cambios (${pendingChanges})`;
      } else {
        btn.disabled = true;
        btn.classList.remove('pending');
        btn.textContent = '💾 Guardar Cambios';
      }
    }

    // ✅ FUNCIÓN CRÍTICA: Convierte cualquier capa de Leaflet a GeoJSON
    function layerToGeoJSON(layer, layerType) {
      try {
        // Para markers (puntos)
        if (layerType === 'marker' || layer instanceof L.Marker) {
          const latlng = layer.getLatLng();
          return {
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [latlng.lng, latlng.lat]
            },
            properties: { layerType: 'marker' }
          };
        }
        
        // Para polylines (líneas)
        if (layerType === 'polyline' || layer instanceof L.Polyline) {
          const latlngs = layer.getLatLngs();
          const coordinates = latlngs.map(ll => [ll.lng, ll.lat]);
          return {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: coordinates
            },
            properties: { layerType: 'polyline' }
          };
        }
        
        // Para polygons (polígonos libres)
        if (layerType === 'polygon' || (layer instanceof L.Polygon && !(layer instanceof L.Rectangle))) {
          const latlngs = layer.getLatLngs()[0]; // Primer anillo del polígono
          const coordinates = latlngs.map(ll => [ll.lng, ll.lat]);
          // Cerrar el polígono si no está cerrado
          if (JSON.stringify(coordinates[0]) !== JSON.stringify(coordinates[coordinates.length - 1])) {
            coordinates.push(coordinates[0]);
          }
          return {
            type: "Feature",
            geometry: {
              type: "Polygon",
              coordinates: [coordinates]
            },
            properties: { layerType: 'polygon' }
          };
        }
        
        // Para rectangles (rectángulos)
        if (layerType === 'rectangle' || layer instanceof L.Rectangle) {
          const bounds = layer.getBounds();
          const sw = bounds.getSouthWest();
          const ne = bounds.getNorthEast();
          const nw = L.latLng(ne.lat, sw.lng);
          const se = L.latLng(sw.lat, ne.lng);
          
          const coordinates = [
            [sw.lng, sw.lat],
            [se.lng, se.lat],
            [ne.lng, ne.lat],
            [nw.lng, nw.lat],
            [sw.lng, sw.lat] // Cerrar el rectángulo
          ];
          
          return {
            type: "Feature",
            geometry: {
              type: "Polygon",
              coordinates: [coordinates]
            },
            properties: { layerType: 'rectangle' }
          };
        }
        
        // Fallback: intentar toGeoJSON nativo
        return layer.toGeoJSON();
        
      } catch (error) {
        console.error('Error convirtiendo capa a GeoJSON:', error, layer);
        return null;
      }
    }

    // ✅ Dibujo creado - Con conversión mejorada
    map.on(L.Draw.Event.CREATED, (e) => {
      const layer = e.layer;
      const type = e.layerType;
      
      console.log('✏️ Geometría creada:', type);
      
      // Aplicar estilos según el tipo
      if (type === 'polyline') {
        layer.setStyle({ color: '#f39c12', weight: 4 });
      } else if (type === 'polygon' || type === 'rectangle') {
        layer.setStyle({ 
          color: '#f39c12', 
          weight: 4, 
          fillOpacity: 0.3,
          fillColor: '#f39c12'
        });
      }
      
      // Agregar al grupo de borradores
      localDrafts.addLayer(layer);
      
      // Guardar el tipo de geometría en la capa para referencia
      layer.geometryType = type;
      
      pendingChanges++;
      updateSaveButton();
      
      console.log('✅ Capa agregada. Pendientes:', pendingChanges);
    });

    // Geometría editada
    map.on(L.Draw.Event.EDITED, (e) => {
      console.log('✏️ Geometrías editadas');
      pendingChanges = localDrafts.getLayers().length;
      updateSaveButton();
    });

    // Geometría eliminada
    map.on(L.Draw.Event.DELETED, (e) => {
      console.log('🗑️ Geometrías eliminadas');
      pendingChanges = localDrafts.getLayers().length;
      updateSaveButton();
    });

    // ✅ Botón de guardado - Con conversión mejorada
    document.getElementById('saveBtn').onclick = async () => {
      const btn = document.getElementById('saveBtn');
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = "⌛ Guardando...";

      try {
        const layersToSave = [];
        
        localDrafts.eachLayer(layer => {
          const geojson = layerToGeoJSON(layer, layer.geometryType);
          if (geojson) {
            layersToSave.push({ layer, geojson });
          } else {
            console.warn('⚠️ No se pudo convertir capa:', layer);
          }
        });

        if (layersToSave.length === 0) {
          alert('No hay geometrías válidas para guardar');
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }

        console.log('💾 Guardando', layersToSave.length, 'geometrías...');

        const promises = layersToSave.map(({ geojson }) => 
          addDoc(collection(db, "geometrias"), {
            feature: geojson,
            autor: miNombre,
            fecha: new Date().toLocaleString('es-CL', { 
              timeZone: 'America/Santiago',
              dateStyle: 'short',
              timeStyle: 'short'
            }),
            timestamp: serverTimestamp()
          })
        );
        
        await Promise.all(promises);
        
        console.log('✅ Guardado exitoso');
        
        // Limpiar capas locales
        localDrafts.clearLayers();
        pendingChanges = 0;
        updateSaveButton();
        
        // Feedback visual
        btn.textContent = "✓ Guardado exitoso";
        btn.style.background = "#27ae60";
        setTimeout(() => {
          btn.textContent = "💾 Guardar Cambios";
          btn.style.background = "";
        }, 2000);
        
      } catch (err) {
        console.error("❌ Error al guardar:", err);
        alert(`Error al guardar: ${err.message}`);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    // ✅ Sincronización mejorada - Renderiza correctamente todas las geometrías
    onSnapshot(collection(db, "geometrias"), (snapshot) => {
      cloudLayers.clearLayers();
      let count = 0;
      let countByType = { Point: 0, LineString: 0, Polygon: 0 };
      
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.feature && data.feature.geometry) {
          const geom = data.feature.geometry;
          const geomType = geom.type;
          
          try {
            const geoJsonLayer = L.geoJSON(data.feature, {
              style: (feature) => ({
                color: '#3498db',
                weight: 3,
                fillOpacity: 0.2,
                fillColor: '#3498db'
              }),
              pointToLayer: (feature, latlng) => {
                return L.marker(latlng);
              }
            });
            
            geoJsonLayer.bindPopup(`
              <b>Tipo:</b> ${geomType}<br>
              <b>Autor:</b> ${data.autor}<br>
              <b>Fecha:</b> ${data.fecha || 'N/A'}
            `);
            
            geoJsonLayer.addTo(cloudLayers);
            countByType[geomType] = (countByType[geomType] || 0) + 1;
            count++;
          } catch (err) {
            console.error('Error renderizando geometría:', err, data.feature);
          }
        }
      });
      
      console.log('📡 Sincronizado:', countByType);
      document.getElementById('status').textContent = 
        `📡 En línea: ${countByType.Point || 0} puntos, ${countByType.LineString || 0} líneas, ${countByType.Polygon || 0} polígonos`;
    }, (error) => {
      console.error("❌ Error en sincronización:", error);
      document.getElementById('status').textContent = '❌ Desconectado';
    });

    // ✅ Importación KML mejorada
    document.getElementById('kmlInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const blobUrl = URL.createObjectURL(file);
      
      try {
        const kmlLayer = omnivore.kml(blobUrl);
        
        kmlLayer.on('ready', function() {
          URL.revokeObjectURL(blobUrl);
          
          const bounds = kmlLayer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds);
          }
          
          let count = 0;
          kmlLayer.eachLayer(layer => {
            // Determinar tipo de geometría
            let geomType = 'marker';
            if (layer instanceof L.Polygon) geomType = 'polygon';
            else if (layer instanceof L.Polyline) geomType = 'polyline';
            
            layer.geometryType = geomType;
            
            // Aplicar estilo
            if (layer.setStyle) {
              layer.setStyle({ 
                color: '#f39c12', 
                weight: 4,
                fillOpacity: 0.3,
                fillColor: '#f39c12'
              });
            }
            
            localDrafts.addLayer(layer);
            count++;
          });
          
          pendingChanges += count;
          updateSaveButton();
          document.getElementById('status').textContent = `✓ KML cargado (${count} elementos)`;
          
          setTimeout(() => {
            document.getElementById('status').textContent = '📡 En línea';
          }, 3000);
        });

        kmlLayer.on('error', function(err) {
          console.error("Error al parsear KML:", err);
          URL.revokeObjectURL(blobUrl);
          alert("Error al cargar el archivo KML. Verifica que sea un KML válido.");
        });

      } catch (err) {
        console.error("Error procesando KML:", err);
        URL.revokeObjectURL(blobUrl);
        alert("No se pudo procesar el archivo KML.");
      }
      
      e.target.value = '';
    };

    // Debug monitor
    setInterval(() => {
      const localCount = localDrafts.getLayers().length;
      const cloudCount = cloudLayers.getLayers().length;
      if (localCount > 0 || cloudCount > 0) {
        console.log('📊 Estado:', { 
          locales: localCount, 
          nube: cloudCount,
          pendientes: pendingChanges 
        });
      }
    }, 10000);
  </script>
</body>
</html>
