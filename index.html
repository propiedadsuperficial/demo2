<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: calc(100vh - 84px); }
    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px; border-bottom: 1px solid #e0e0e0; font-family: system-ui, Arial;
      background: #fafafa;
    }
    .toolbar input[type=text] { width: 400px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .toolbar button { padding: 6px 10px; border: 1px solid #2c7be5; background: #2c7be5; color: #fff; border-radius: 4px; cursor: pointer; }
    .toolbar button.secondary { border-color: #666; background: #f5f5f5; color: #333; }
    .coords { margin-left: auto; font-weight: bold; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Fondo XYZ:</strong>
    <input id="xyzUrl" type="text" value="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}" />
    <button id="btnAplicar">Aplicar</button>
    <button id="btnDescargar" class="secondary">Descargar GeoJSON</button>
    <button id="btnLimpiar" class="secondary">Limpiar Vista Local</button>
    <span class="coords" id="coords">Lat/Lon: —</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <script type="module">
    // --- INTEGRACIÓN FIREBASE CON TUS CREDENCIALES REALES ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027",
      measurementId: "G-2CSXPQNZSC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const dibujosRef = collection(db, "geometrias");

    const miNombre = prompt("Identifícate para colaborar:") || "Anónimo";

    // --- CONFIGURACIÓN MAPA (LEAFLET) ---
    const map = L.map('map').setView([-27.366, -70.332], 15);
    const drawnItems = new L.FeatureGroup().addTo(map);

    // Fondo por defecto: Esri Satélite
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery'
    }).addTo(map);

    const drawControl = new L.Control.Draw({
      edit: { featureGroup: drawnItems, remove: true },
      draw: { circlemarker: false }
    }).addTo(map);

    // GUARDAR: Se sube a Firebase al terminar de dibujar
    map.on(L.Draw.Event.CREATED, async (e) => {
      const layer = e.layer;
      const geojson = layer.toGeoJSON();
      
      try {
        await addDoc(dibujosRef, {
          feature: geojson,
          autor: miNombre,
          fecha: new Date().toLocaleString('es-CL')
        });
      } catch (err) {
        console.error("Error al guardar en Firebase:", err);
      }
    });

    // BORRAR: Elimina el registro de la base de datos sincronizada
    map.on(L.Draw.Event.DELETED, (e) => {
      e.layers.eachLayer(async (layer) => {
        if (layer.options.firebaseId) {
          await deleteDoc(doc(db, "geometrias", layer.options.firebaseId));
        }
      });
    });

    // SINCRONIZAR: Escucha cambios y actualiza el mapa para todos
    // --- REEMPLAZA TU FUNCIÓN onSnapshot CON ESTA ---
    onSnapshot(dibujosRef, (snapshot) => {
      // En lugar de borrar todo de golpe, manejamos los cambios
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const data = change.doc.data();
          L.geoJSON(data.feature, {
            onEachFeature: (f, l) => {
              l.options.firebaseId = change.doc.id; // Guardamos el ID de Firebase
              l.bindPopup(`<b>Autor:</b> ${data.autor}<br><b>Fecha:</b> ${data.fecha}`);
              drawnItems.addLayer(l);
            }
          });
        }
        if (change.type === "removed") {
          // Si alguien borra algo en la nube, lo quitamos de nuestra pantalla
          drawnItems.eachLayer((layer) => {
            if (layer.options.firebaseId === change.doc.id) {
              drawnItems.removeLayer(layer);
            }
          });
        }
      });
    });

    // COORDENADAS EN BARRA SUPERIOR
    map.on('mousemove', e => {
      document.getElementById('coords').textContent = `Lat/Lon: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
    });

    // DESCARGAR GEOJSON PARA QGIS/ARCGIS
    document.getElementById('btnDescargar').addEventListener('click', () => {
      const data = drawnItems.toGeoJSON();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `gis_pucobre_${new Date().getTime()}.geojson`;
      a.click();
    });

    // APLICAR FONDO XYZ PERSONALIZADO
    document.getElementById('btnAplicar').addEventListener('click', () => {
      const url = document.getElementById('xyzUrl').value.trim();
      if (url) L.tileLayer(url).addTo(map);
    });

    document.getElementById('btnLimpiar').addEventListener('click', () => {
      drawnItems.clearLayers();
    });
  </script>
</body>

</html>
