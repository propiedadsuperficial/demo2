  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" crossorigin="anonymous">

  <style>
    :root {
      --header-h: 56px;
      --brand: #27ae60;
      --bg-header: #1f2937;
      --text-header: #e5e7eb;
    }
    
    * { box-sizing: border-box; }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--bg-header);
      color: var(--text-header);
      border-bottom: 1px solid #111827;
    }
    
    .brand {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand);
    }
    
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      background: #10b981;
      color: white;
      transition: opacity 0.2s;
    }
    
    .btn:hover:not(:disabled) {
      opacity: 0.85;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #3b82f6;
    }
    
    .spacer {
      flex: 1;
    }
    
    .status {
      font-size: 13px;
      opacity: 0.9;
    }
    
    .user {
      font-size: 13px;
      font-weight: 600;
      padding-left: 12px;
      border-left: 1px solid #374151;
    }
    
    #map {
      flex: 1;
      background: #f3f4f6;
    }
    
    .leaflet-control-container .leaflet-top.leaflet-left {
      margin-top: 66px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>GIS Pucobre</span>
    </div>
    
    <div class="toolbar">
      <button id="saveBtn" class="btn" disabled>💾 Guardar Cambios</button>
      <label for="kmlInput" class="btn btn-secondary">📁 Cargar KML</label>
      <input id="kmlInput" type="file" accept=".kml,.geojson,.json" style="display:none">
    </div>
    
    <div class="spacer"></div>
    <div class="status" id="status">🔌 Iniciando...</div>
    <div class="user" id="userInfo">👤</div>
  </header>
  
  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
