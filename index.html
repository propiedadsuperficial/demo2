<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre (v2.0)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #toolbar { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    #map { width: 100%; height: calc(100% - 60px); background: #eee; }
    .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
    .btn-save { background: #27ae60; color: white; }
    .btn-save:disabled { background: #7f8c8d; cursor: not-allowed; }
    .btn-save.pending { background: #e67e22; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    .status { font-size: 13px; color: #bdc3c7; margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .badge { padding: 2px 6px; border-radius: 10px; font-size: 10px; text-transform: uppercase; }
    .badge-user { background: #34495e; color: #ecf0f1; }
    .badge-admin { background: #f1c40f; color: #2c3e50; }
    .debug-panel { 
      position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.85); color: #00ff00; 
      padding: 12px; border-radius: 5px; font-family: 'Consolas', monospace; font-size: 11px; 
      max-width: 450px; max-height: 200px; overflow-y: auto; display: none; z-index: 9999; border: 1px solid #444;
    }
    .debug-panel.active { display: block; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>PUCOBRE GIS</strong>
    <button id="saveBtn" class="btn btn-save" disabled title="Sincronizar borradores locales con la nube">💾 Guardar Cambios</button>
    <label class="btn" style="background:#3498db; color:white" for="kmlInput">📁 Cargar KML</label>
    <input id="kmlInput" type="file" style="display:none" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" />
    <button id="debugToggle" class="btn" style="background:#9b59b6; color:white">🐛 Debug</button>
    <div id="userInfo" style="display: flex; gap: 5px; align-items: center;"></div>
    <span id="status" class="status">🔌 Iniciando...</span>
  </div>

  <div id="map"></div>
  <div id="debugPanel" class="debug-panel"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

  <script type="module">
    // NOTE: Importaciones modulares de Firebase v10
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js';
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js';
    import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js';

    // === CONFIGURACIÓN Y PARÁMETROS ===
    // TODO: Reemplaza con tu UID real tras loguearte como Superusuario
    const SUPERUSER_UID = "<REEMPLAZA_CON_TU_UID>"; 
    const COLLECTION_NAME = "geometrias";
    const GH_PAGES_DOMAIN = "propiedadespucobreoficial.github.io";

    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027"
    };

    // Inicialización
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;
    let isSuperuser = false;

    // === SISTEMA DE DEBUG ===
    const debugPanel = document.getElementById('debugPanel');
    let debugMessages = [];
    function debugLog(message, type = 'info') {
      const ts = new Date().toLocaleTimeString();
      const emojis = { error: '❌', success: '✅', warning: '⚠️', info: 'ℹ️' };
      const msg = `${ts} ${emojis[type] || '🔹'} ${message}`;
      console.log(msg);
      debugMessages.push(`<div>${msg}</div>`);
      if (debugMessages.length > 50) debugMessages.shift();
      debugPanel.innerHTML = debugMessages.join('');
      debugPanel.scrollTop = debugPanel.scrollHeight;
    }
    document.getElementById('debugToggle').onclick = () => debugPanel.classList.toggle('active');

    // === GESTIÓN DE AUTENTICACIÓN ===
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        isSuperuser = (user.uid === SUPERUSER_UID);
        debugLog(`Usuario autenticado: ${user.uid} (${isSuperuser ? 'SUPERUSER' : 'ANON'})`, 'success');
        
        const badge = isSuperuser ? '<span class="badge badge-admin">SUPERUSER</span>' : '<span class="badge badge-user">LECTOR/EDITOR</span>';
        document.getElementById('userInfo').innerHTML = `${badge} <small style="color:white">${user.uid.substring(0,6)}...</small>`;
        
        initMapControls(); // Inicializar o re-inicializar controles según permisos
      } else {
        debugLog('No hay sesión. Iniciando login anónimo...', 'warning');
        signInAnonymously(auth).catch(err => debugLog(`Error Auth: ${err.code}`, 'error'));
      }
    });

    // === CONFIGURACIÓN DEL MAPA ===
    const map = L.map('map').setView([-27.366, -70.332], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery'
    }).addTo(map);

    const cloudLayers = L.featureGroup().addTo(map);   // Geometrías de Firestore
    const localDrafts = L.featureGroup().addTo(map);   // Borradores locales (amarillos)
    let drawControl = null;

    function initMapControls() {
      if (drawControl) map.removeControl(drawControl);
      
      // CA2 & CA3: Solo superusuario ve herramientas de edición/borrado de capas existentes
      drawControl = new L.Control.Draw({
        edit: {
          featureGroup: localDrafts, // Solo permitimos editar lo que aún no se guarda
          remove: true,
          edit: true
        },
        draw: {
          circle: false, circlemarker: false,
          polyline: { shapeOptions: { color: '#f1c40f', weight: 5 } },
          polygon: { shapeOptions: { color: '#f1c40f', fillOpacity: 0.4 } },
          rectangle: { shapeOptions: { color: '#f1c40f' } },
          marker: true
        }
      });
      map.addControl(drawControl);
    }

    // === MANEJO DE CAPAS NUBE (READ & SYNC) ===
    // CA1 & CA4: Sincronización en tiempo real con onSnapshot
    onSnapshot(collection(db, COLLECTION_NAME), (snapshot) => {
      cloudLayers.clearLayers();
      let counts = { Point: 0, LineString: 0, Polygon: 0 };

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (!data.feature) return;

        const geojson = L.geoJSON(data.feature, {
          style: { color: '#3498db', weight: 3, fillOpacity: 0.2 },
          pointToLayer: (feat, latlng) => L.marker(latlng)
        });

        // Popup con opción de eliminar si es superusuario
        geojson.bindPopup(() => {
          const container = document.createElement('div');
          container.innerHTML = `
            <strong>${data.autor || 'Anon'}</strong><br>
            <small>${data.fecha || 'Sin fecha'}</small><hr>
            ${isSuperuser ? `<button class="btn" style="background:#e74c3c; color:white; font-size:10px" onclick="window.deleteFeature('${docSnap.id}')">🗑 Eliminar</button>` : ''}
          `;
          return container;
        });

        geojson.addTo(cloudLayers);
        const type = data.feature.geometry.type;
        counts[type] = (counts[type] || 0) + 1;
      });

      const total = snapshot.size;
      document.getElementById('status').innerHTML = `📡 Conectado | Nube: ${total} obj.`;
      debugLog(`Sincronizados ${total} objetos de Firestore`, 'success');
    }, (err) => {
      debugLog(`Error de Snapshot: ${err.code}`, 'error');
      document.getElementById('status').innerHTML = `❌ Desconectado (${err.code})`;
    });

    // Función global para que el popup pueda borrar (solo si las reglas lo permiten)
    window.deleteFeature = async (id) => {
      if (!isSuperuser) return alert("No tienes permisos.");
      if (confirm("¿Eliminar geometría de forma permanente?")) {
        try {
          await deleteDoc(doc(db, COLLECTION_NAME, id));
          debugLog(`Documento ${id} eliminado`, 'success');
        } catch (e) {
          debugLog(`Error al borrar: ${e.message}`, 'error');
        }
      }
    };

    // === EVENTOS DE DIBUJO LOCAL ===
    let pendingChanges = 0;
    map.on(L.Draw.Event.CREATED, (e) => {
      const layer = e.layer;
      layer.geometryType = e.layerType;
      localDrafts.addLayer(layer);
      pendingChanges++;
      updateSaveUI();
    });

    map.on([L.Draw.Event.EDITED, L.Draw.Event.DELETED], () => {
      pendingChanges = localDrafts.getLayers().length;
      updateSaveUI();
    });

    function updateSaveUI() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = (pendingChanges === 0);
      btn.classList.toggle('pending', pendingChanges > 0);
      btn.innerHTML = pendingChanges > 0 ? `💾 Guardar Cambios (${pendingChanges})` : `💾 Guardar Cambios`;
    }

    // === GUARDADO (PERSISTENCIA) ===
    // CA6: Limpiar solo lo exitoso
    document.getElementById('saveBtn').onclick = async () => {
      const btn = document.getElementById('saveBtn');
      const layers = localDrafts.getLayers();
      const operator = prompt("Nombre del operador:", "Anon") || "Anon";
      
      btn.disabled = true;
      btn.innerHTML = "⌛ Procesando...";
      
      let successCount = 0;
      let errorCount = 0;

      for (const layer of layers) {
        try {
          const geojson = layer.toGeoJSON();
          // Inyectamos metadatos requeridos por reglas y UI
          await addDoc(collection(db, COLLECTION_NAME), {
            feature: geojson,
            autor: operator,
            createdBy: currentUser.uid,
            createdAt: serverTimestamp(),
            fecha: new Date().toLocaleString('es-CL')
          });
          
          localDrafts.removeLayer(layer); // Removemos del mapa solo si Firestore aceptó
          successCount++;
        } catch (err) {
          errorCount++;
          debugLog(`Fallo en objeto: ${err.message}`, 'error');
        }
      }

      pendingChanges = localDrafts.getLayers().length;
      updateSaveUI();
      
      if (errorCount > 0) {
        alert(`Guardado parcial: ${successCount} ok, ${errorCount} fallaron (revisa reglas de Firestore).`);
      } else {
        debugLog(`¡Éxito! ${successCount} geometrías guardadas.`, 'success');
      }
    };

    // === IMPORTACIÓN KML (CA5) ===
    document.getElementById('kmlInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const kmlData = event.target.result;
        const runOmnivore = omnivore.kml.parse(kmlData);
        
        runOmnivore.on('ready', () => {
          let count = 0;
          runOmnivore.eachLayer(l => {
            l.setStyle({ color: '#f1c40f', weight: 4 });
            localDrafts.addLayer(l);
            count++;
          });
          pendingChanges += count;
          updateSaveUI();
          map.fitBounds(localDrafts.getBounds());
          debugLog(`KML: ${count} elementos cargados como borrador`, 'success');
        });
      };
      reader.readAsText(file);
    };

  </script>

  </body>
</html>
