<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIS Pucobre - Proyectos Colaborativos</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <link rel="stylesheet" href="css/index.css" />
    
    <style>
        /* Ajustes rápidos para la nueva barra de herramientas */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .btn-kml {
            background-color: #27ae60 !important;
            cursor: pointer;
        }
        .status-container {
            flex-grow: 1;
            text-align: right;
            font-size: 0.9em;
        }
        #userInfo {
            border-left: 1px solid #7f8c8d;
            padding-left: 15px;
            font-weight: bold;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="https://www.pucobre.cl/wp-content/uploads/2021/10/logo-pucobre.png" alt="Logo" style="height: 30px; filter: brightness(0) invert(1);">
            <strong style="font-size: 1.2em;">GIS</strong>
        </div>

        <button id="saveBtn" class="btn btn-save" disabled>💾 Guardar Cambios</button>
        
        <label class="btn btn-kml" for="kmlInput">📁 Cargar KML / GeoJSON</label>
        <input id="kmlInput" type="file" style="display:none" accept=".kml,.kmz,.geojson,.json" />

        <div class="status-container">
            <span id="status" class="status">🔌 Iniciando conexión...</span>
        </div>
        <div id="userInfo">👤 Identificando...</div>
    </div>

    <div id="map" style="height: calc(100vh - 60px); width: 100%;"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script type="module" src="js/index.js"></script>
</body>
</html>
