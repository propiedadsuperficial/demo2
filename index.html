<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }
    #toolbar { padding: 10px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; }
    #map { width: 100%; height: calc(100% - 60px); background: #eee; }
    .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-save { background: #27ae60; color: white; }
    .btn-save:disabled { background: #7f8c8d; cursor: not-allowed; }
    .btn-save.pending { background: #e74c3c; }
    .status { font-size: 12px; color: #bdc3c7; margin-left: auto; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>PUCOBRE GIS</strong>
    <button id="saveBtn" class="btn btn-save" disabled>💾 Guardar Cambios</button>
    <label class="btn" style="background:#3498db; color:white" for="kmlInput">📁 Cargar KML</label>
    <input id="kmlInput" type="file" style="display:none" accept=".kml" />
    <span id="status" class="status">Conectando...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js';
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js';

    // Credenciales Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const miNombre = prompt("Operador:") || "Operador";

    // Mapa con Esri Satélite
    const map = L.map('map').setView([-27.366, -70.332], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery'
    }).addTo(map);

    const cloudLayers = L.featureGroup().addTo(map);
    const localDrafts = L.featureGroup().addTo(map);

    new L.Control.Draw({
      edit: { featureGroup: localDrafts },
      draw: { circle: false, circlemarker: false }
    }).addTo(map);

    // Contador de capas pendientes
    let pendingChanges = 0;

    function updateSaveButton() {
      const btn = document.getElementById('saveBtn');
      if (pendingChanges > 0) {
        btn.disabled = false;
        btn.classList.add('pending');
        btn.textContent = `💾 Guardar Cambios (${pendingChanges})`;
      } else {
        btn.disabled = true;
        btn.classList.remove('pending');
        btn.textContent = '💾 Guardar Cambios';
      }
    }

    // Dibujo creado
    map.on(L.Draw.Event.CREATED, (e) => {
      const layer = e.layer;
      layer.setStyle({ color: '#f39c12', weight: 4, fillOpacity: 0.3 }); 
      localDrafts.addLayer(layer);
      pendingChanges++;
      updateSaveButton();
    });

    // Geometría editada
    map.on(L.Draw.Event.EDITED, (e) => {
      pendingChanges = localDrafts.getLayers().length;
      updateSaveButton();
    });

    // Geometría eliminada
    map.on(L.Draw.Event.DELETED, (e) => {
      pendingChanges = localDrafts.getLayers().length;
      updateSaveButton();
    });

    // Botón de guardado - FIX: Ya no se queda pegado
    document.getElementById('saveBtn').onclick = async () => {
      const btn = document.getElementById('saveBtn');
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = "⌛ Guardando...";

      try {
        const layersToSave = [];
        localDrafts.eachLayer(layer => {
          layersToSave.push(layer);
        });

        if (layersToSave.length === 0) {
          btn.textContent = originalText;
          return;
        }

        const promises = layersToSave.map(layer => 
          addDoc(collection(db, "geometrias"), {
            feature: layer.toGeoJSON(),
            autor: miNombre,
            fecha: new Date().toLocaleString(),
            timestamp: serverTimestamp()
          })
        );
        
        await Promise.all(promises);
        
        // Limpiar capas locales y resetear contador
        localDrafts.clearLayers();
        pendingChanges = 0;
        updateSaveButton();
        
        // Feedback visual
        btn.textContent = "✓ Guardado";
        btn.style.background = "#27ae60";
        setTimeout(() => {
          btn.textContent = "💾 Guardar Cambios";
        }, 2000);
        
      } catch (err) {
        console.error("Error al guardar:", err);
        alert("Error al guardar. Verifica tu conexión.");
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    // Sincronización en tiempo real
    onSnapshot(collection(db, "geometrias"), (snapshot) => {
      cloudLayers.clearLayers();
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.feature) {
          L.geoJSON(data.feature, {
            style: { color: '#3498db', weight: 3, fillOpacity: 0.2 }
          }).bindPopup(`
            <b>Autor:</b> ${data.autor}<br>
            <b>Fecha:</b> ${data.fecha || 'N/A'}
          `).addTo(cloudLayers);
        }
      });
      document.getElementById('status').textContent = '📡 En línea';
    }, (error) => {
      console.error("Error en sincronización:", error);
      document.getElementById('status').textContent = '❌ Desconectado';
    });

    // Importación KML - FIX: Ahora muestra correctamente el KML
    document.getElementById('kmlInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const kmlText = event.target.result;
          
          // Parsear KML usando omnivore
          const kmlLayer = omnivore.kml.parse(kmlText);
          
          kmlLayer.on('ready', function() {
            // Ajustar vista al contenido del KML
            if (kmlLayer.getBounds().isValid()) {
              map.fitBounds(kmlLayer.getBounds());
            }
            
            // Agregar cada capa al grupo de borradores locales
            kmlLayer.eachLayer(layer => {
              // Aplicar estilo naranja para indicar que está pendiente de guardar
              if (layer.setStyle) {
                layer.setStyle({ 
                  color: '#f39c12', 
                  weight: 4,
                  fillOpacity: 0.3 
                });
              }
              localDrafts.addLayer(layer);
              pendingChanges++;
            });
            
            updateSaveButton();
            document.getElementById('status').textContent = `✓ KML cargado (${pendingChanges} elementos)`;
            
            // Resetear después de 3 segundos
            setTimeout(() => {
              document.getElementById('status').textContent = '📡 En línea';
            }, 3000);
          });

          kmlLayer.on('error', function(err) {
            console.error("Error al parsear KML:", err);
            alert("Error al cargar el archivo KML. Verifica que sea un KML válido.");
          });

        } catch (err) {
          console.error("Error procesando KML:", err);
          alert("No se pudo procesar el archivo KML.");
        }
      };
      
      reader.onerror = () => {
        alert("Error al leer el archivo.");
      };
      
      reader.readAsText(file);
      
      // Resetear input para permitir cargar el mismo archivo nuevamente
      e.target.value = '';
    };
  </script>
</body>
</html>
