<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIS Colaborativo - Pucobre</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #map { height: calc(100vh - 84px); }
    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px; border-bottom: 1px solid #e0e0e0; font-family: system-ui, Arial;
      background: #fafafa;
    }
    .toolbar input[type=text] { width: 300px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .toolbar button { padding: 6px 10px; border: 1px solid #2c7be5; background: #2c7be5; color: #fff; border-radius: 4px; cursor: pointer; }
    .toolbar button.secondary { border-color: #666; background: #f5f5f5; color: #333; }
    .coords { margin-left: auto; font-weight: bold; font-size: 0.85em; }
  </style>
</head>
<body>

  <div class="toolbar">
    <strong>Fondo:</strong>
    <input id="xyzUrl" type="text" value="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}" />
    <button id="btnAplicar">Aplicar</button>
    <button id="btnSubirKml" style="background-color: #28a745; border-color: #28a745;">📁 Cargar y Compartir KML</button>
    <button id="btnDescargar" class="secondary">Descargar Todo</button>
    <input type="file" id="fileInput" accept=".kml,application/vnd.google-earth.kml+xml,.xml" style="display:none" />
    <span class="coords" id="coords">Lat/Lon: —</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB3kW9ep7iOKDp87i2-er5-CuZKerA4puY",
      authDomain: "gis-pucobre.firebaseapp.com",
      projectId: "gis-pucobre",
      storageBucket: "gis-pucobre.appspot.com",
      messagingSenderId: "654550355942",
      appId: "1:654550355942:web:06a8bd8614a0faa86f5027",
      measurementId: "G-2CSXPQNZSC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const dibujosRef = collection(db, "geometrias");

    const miNombre = prompt("Nombre del Operador:") || "Anónimo";

    const map = L.map('map').setView([-27.366, -70.332], 15);
    const drawnItems = new L.FeatureGroup().addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Pucobre - Esri'
    }).addTo(map);

    new L.Control.Draw({
      edit: { featureGroup: drawnItems, remove: true },
      draw: { circlemarker: false, circle: false }
    }).addTo(map);

    // GUARDAR DIBUJOS MANUALES
    map.on(L.Draw.Event.CREATED, async (e) => {
      const layer = e.layer;
      const geojson = layer.toGeoJSON();
      map.removeLayer(layer); // Evita duplicado visual antes de que llegue de la nube

      try {
        await addDoc(dibujosRef, {
          feature: geojson,
          autor: miNombre,
          fecha: new Date().toLocaleString('es-CL')
        });
      } catch (err) { console.error(err); }
    });

    // BORRAR DIBUJOS (SINCRONIZADO)
    map.on(L.Draw.Event.DELETED, (e) => {
      e.layers.eachLayer(async (layer) => {
        if (layer.options.firebaseId) {
          await deleteDoc(doc(db, "geometrias", layer.options.firebaseId));
        }
      });
    });

    // SINCRONIZACIÓN EN TIEMPO REAL
    onSnapshot(dibujosRef, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        if (change.type === "added") {
          let existe = false;
          drawnItems.eachLayer(l => { if(l.options.firebaseId === id) existe = true; });
          if (!existe) {
            const data = change.doc.data();
            L.geoJSON(data.feature, {
              onEachFeature: (f, l) => {
                l.options.firebaseId = id;
                l.bindPopup(`<b>Autor:</b> ${data.autor}<br><b>Fecha:</b> ${data.fecha}`);
                drawnItems.addLayer(l);
              }
            });
          }
        }
        if (change.type === "removed") {
          drawnItems.eachLayer(l => { if (l.options.firebaseId === id) drawnItems.removeLayer(l); });
        }
      });
    });

    // LÓGICA DE SUBIDA DE KML
    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnSubirKml').onclick = () => fileInput.click();

    fileInput.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const kmlData = event.target.result;
          const kmlLayer = omnivore.kml.parse(kmlData);
          
          kmlLayer.on('ready', () => {
            // Zoom automático a los datos del KML
            map.fitBounds(kmlLayer.getBounds());
            
            // Subir cada elemento del KML a la base de datos
            kmlLayer.eachLayer(layer => {
              addDoc(dibujosRef, {
                feature: layer.toGeoJSON(),
                autor: miNombre + " (Importado KML)",
                fecha: new Date().toLocaleString('es-CL')
              });
            });
            alert("Archivo KML cargado y sincronizado con el equipo.");
          });
        } catch (err) {
          alert("Error al leer el KML. Asegúrate de que sea un archivo válido.");
        }
      };
      reader.readAsText(file);
    };

    map.on('mousemove', e => {
      document.getElementById('coords').textContent = `Lat/Lon: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
    });
  </script>
</body>
</html>
